<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | El Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-people text-taller"></i> Clientes</h1>
        <p class="text-secondary mb-0"><span id="contador">0</span> clientes registrados</p>
      </div>
      <button class="btn btn-taller" id="btnNuevo"><i class="bi bi-person-plus"></i> Nuevo cliente</button>
    </div>

    <div class="card shadow-sm mb-3"><div class="card-body">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="search" class="form-control" id="buscar" placeholder="Buscar por nombre o cédula">
      </div>
    </div></div>

    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr><th>Cédula</th><th>Nombre</th><th>Teléfono</th><th>Correo</th><th>Motos</th><th class="text-end">Acciones</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div></div>
  </main>

  <!-- Formulario de cliente -->
  <div class="modal fade" id="modalCliente" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="formCliente" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloCliente">Nuevo cliente</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-5">
            <label class="form-label">Cédula *</label>
            <input class="form-control" id="documento" required pattern="[0-9]{5,20}" inputmode="numeric">
            <div class="invalid-feedback">Solo números, entre 5 y 20.</div>
          </div>
          <div class="col-md-7">
            <label class="form-label">Nombre completo *</label>
            <input class="form-control" id="nombre" required minlength="3" maxlength="100">
            <div class="invalid-feedback">Mínimo 3 caracteres.</div>
          </div>
          <div class="col-md-5">
            <label class="form-label">Teléfono *</label>
            <input class="form-control" id="telefono" required pattern="[0-9+ ]{7,20}" inputmode="tel">
            <div class="invalid-feedback">Entre 7 y 20 números.</div>
          </div>
          <div class="col-md-7">
            <label class="form-label">Correo</label>
            <input type="email" class="form-control" id="correo" maxlength="100">
            <div class="invalid-feedback">Correo no válido.</div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-taller" id="btnGuardar"><i class="bi bi-save"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Motos del cliente -->
  <div class="modal fade" id="modalMotos" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5"><i class="bi bi-bicycle text-taller"></i> Motos de <span id="duenoMotos"></span></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="table-responsive mb-3">
            <table class="table table-sm align-middle">
              <thead><tr><th>Placa</th><th>Moto</th><th>Año</th><th>Apodo</th><th></th></tr></thead>
              <tbody id="tablaMotos"></tbody>
            </table>
          </div>

          <h3 class="h6 fw-bold">Agregar moto</h3>
          <form class="row g-2" id="formMoto" novalidate>
            <div class="col-6 col-md-2">
              <input class="form-control text-uppercase" id="placa" placeholder="Placa *" required pattern="[A-Za-z0-9]{5,7}">
              <div class="invalid-feedback">5 a 7 letras o números.</div>
            </div>
            <div class="col-6 col-md-2">
              <input class="form-control" id="marcaMoto" placeholder="Marca *" required minlength="2" maxlength="40">
              <div class="invalid-feedback">Obligatoria.</div>
            </div>
            <div class="col-6 col-md-3">
              <input class="form-control" id="modelo" placeholder="Modelo *" required maxlength="60">
              <div class="invalid-feedback">Obligatorio.</div>
            </div>
            <div class="col-6 col-md-2">
              <input type="number" class="form-control" id="anio" placeholder="Año" min="1950" max="2100">
              <div class="invalid-feedback">Entre 1950 y 2100.</div>
            </div>
            <div class="col-8 col-md-2">
              <input class="form-control" id="apodo" placeholder="Apodo" maxlength="40">
            </div>
            <div class="col-4 col-md-1">
              <button class="btn btn-taller w-100" title="Agregar"><i class="bi bi-plus-lg"></i></button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/clientes.js"></script>
</body>
</html>
