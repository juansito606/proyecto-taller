<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movimientos | El Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-arrow-left-right text-taller"></i> Ventas y compras</h1>
        <p class="text-secondary mb-0"><span id="contador">0</span> movimientos</p>
      </div>
      <div class="d-flex gap-2">
        <button class="btn btn-success" id="btnVenta"><i class="bi bi-cart-check"></i> Registrar venta</button>
        <button class="btn btn-outline-dark" id="btnCompra"><i class="bi bi-truck"></i> Registrar compra</button>
      </div>
    </div>

    <!-- Totales -->
    <div class="row g-3 mb-3">
      <div class="col-md-4"><div class="card tarjeta-kpi shadow-sm"><div class="card-body">
        <div class="small text-secondary">Total vendido</div><div class="fs-5 fw-bold text-success" id="totalVentas">$ 0</div>
      </div></div></div>
      <div class="col-md-4"><div class="card tarjeta-kpi shadow-sm"><div class="card-body">
        <div class="small text-secondary">Total comprado</div><div class="fs-5 fw-bold" id="totalCompras">$ 0</div>
      </div></div></div>
      <div class="col-md-4"><div class="card tarjeta-kpi shadow-sm"><div class="card-body">
        <div class="small text-secondary">Diferencia</div><div class="fs-5 fw-bold" id="diferencia">$ 0</div>
      </div></div></div>
    </div>

    <!-- Filtros -->
    <div class="card shadow-sm mb-3"><div class="card-body">
      <div class="row g-2">
        <div class="col-6 col-md-2">
          <select class="form-select" id="filtroTipo">
            <option value="">Ventas y compras</option><option>VENTA</option><option>COMPRA</option>
          </select>
        </div>
        <div class="col-6 col-md-4"><select class="form-select" id="filtroRepuesto"></select></div>
        <div class="col-6 col-md-3"><input type="date" class="form-control" id="desde" title="Desde"></div>
        <div class="col-6 col-md-3"><input type="date" class="form-control" id="hasta" title="Hasta"></div>
      </div>
    </div></div>

    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr><th>Fecha</th><th>Tipo</th><th>Repuesto</th><th class="text-center">Cant.</th>
              <th class="text-end">Precio u.</th><th class="text-end">Total</th><th>Cliente</th><th>Registró</th><th></th></tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div></div>
  </main>

  <!-- Formulario -->
  <div class="modal fade" id="modalMovimiento" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="formMovimiento" novalidate>
        <div class="modal-header" id="cabeceraModal">
          <h2 class="modal-title h5" id="tituloModal">Registrar venta</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-12">
            <label class="form-label">Repuesto *</label>
            <select class="form-select" id="id_repuesto" required></select>
            <div class="invalid-feedback">Elija el repuesto.</div>
            <div class="form-text" id="infoRepuesto"></div>
          </div>
          <div class="col-6">
            <label class="form-label">Cantidad *</label>
            <input type="number" class="form-control" id="cantidad" required min="1" step="1" value="1">
            <div class="invalid-feedback" id="errorCantidad">Mínimo 1.</div>
          </div>
          <div class="col-6">
            <label class="form-label" id="etiquetaPrecio">Precio unitario</label>
            <input type="number" class="form-control" id="precio_unitario" min="1" step="1">
            <div class="invalid-feedback">Escriba el precio de compra.</div>
          </div>
          <div class="col-12 solo-venta">
            <label class="form-label">Cliente</label>
            <select class="form-select" id="id_cliente"></select>
          </div>
          <div class="col-12 solo-venta">
            <label class="form-label">¿Se usó en un trabajo del taller?</label>
            <select class="form-select" id="id_trabajo"></select>
          </div>
          <div class="col-12">
            <div class="alert alert-light border mb-0 d-flex justify-content-between">
              <span>Total</span><strong id="totalFormulario">$ 0</strong>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-taller" id="btnGuardar"><i class="bi bi-check-lg"></i> Registrar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/movimientos.js"></script>
</body>
</html>
