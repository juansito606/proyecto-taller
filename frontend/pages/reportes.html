<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes | El Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-bar-chart text-taller"></i> Reportes</h1>
        <p class="text-secondary mb-0">El Hospital · Taller de motos · <span id="fechaReporte"></span></p>
      </div>
      <button class="btn btn-outline-dark no-imprimir" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
    </div>

    <!-- Flujo de caja -->
    <div class="card shadow-sm mb-3"><div class="card-body">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h2 class="h6 fw-bold mb-0"><i class="bi bi-cash-stack text-taller"></i> Flujo de caja</h2>
        <div class="d-flex gap-2 no-imprimir">
          <input type="date" class="form-control form-control-sm" id="desde" title="Desde">
          <input type="date" class="form-control form-control-sm" id="hasta" title="Hasta">
        </div>
      </div>
      <div class="row g-3 text-center" id="flujo"></div>
    </div></div>

    <div class="row g-3">
      <div class="col-lg-6">
        <div class="card shadow-sm h-100"><div class="card-body">
          <h2 class="h6 fw-bold"><i class="bi bi-calendar3 text-taller"></i> Ventas por mes</h2>
          <div id="ventasMes"></div>
        </div></div>
      </div>
      <div class="col-lg-6">
        <div class="card shadow-sm h-100"><div class="card-body">
          <h2 class="h6 fw-bold"><i class="bi bi-trophy text-taller"></i> Repuestos más vendidos</h2>
          <div id="masVendidos"></div>
        </div></div>
      </div>
      <div class="col-12">
        <div class="card shadow-sm"><div class="card-body">
          <h2 class="h6 fw-bold"><i class="bi bi-person-workspace text-taller"></i> Trabajos por trabajador</h2>
          <div id="porTrabajador"></div>
        </div></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/reportes.js"></script>
</body>
</html>
