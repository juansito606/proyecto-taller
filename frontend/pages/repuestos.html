<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Repuestos | El Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-box-seam text-taller"></i> Repuestos</h1>
        <p class="text-secondary mb-0">Inventario del taller · <span id="contador">0</span> repuestos</p>
      </div>
      <button class="btn btn-taller d-none" id="btnNuevo"><i class="bi bi-plus-lg"></i> Nuevo repuesto</button>
    </div>

    <!-- Búsqueda y filtros -->
    <div class="card shadow-sm mb-3"><div class="card-body">
      <div class="row g-2 align-items-center">
        <div class="col-md-4">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="buscar" placeholder="Buscar por nombre o referencia">
          </div>
        </div>
        <div class="col-6 col-md-3"><select class="form-select" id="filtroCategoria"></select></div>
        <div class="col-6 col-md-3"><select class="form-select" id="filtroMarca"></select></div>
        <div class="col-md-2">
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="filtroStockBajo">
            <label class="form-check-label" for="filtroStockBajo">Solo stock bajo</label>
          </div>
        </div>
      </div>
    </div></div>

    <!-- Tabla -->
    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr>
            <th>Referencia</th><th>Nombre</th><th>Categoría</th><th>Marca</th>
            <th class="text-end">Precio</th><th class="text-center">Stock</th>
            <th class="text-end solo-admin d-none">Acciones</th>
          </tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div></div>
  </main>

  <!-- Formulario (ventana emergente) -->
  <div class="modal fade" id="modalRepuesto" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="formRepuesto" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloModal">Nuevo repuesto</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-md-5">
            <label class="form-label">Referencia *</label>
            <input class="form-control" id="referencia" required minlength="2" maxlength="30">
            <div class="invalid-feedback">Entre 2 y 30 caracteres.</div>
          </div>
          <div class="col-md-7">
            <label class="form-label">Nombre *</label>
            <input class="form-control" id="nombre" required minlength="3" maxlength="100">
            <div class="invalid-feedback">Entre 3 y 100 caracteres.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Categoría *</label>
            <select class="form-select" id="id_categoria" required></select>
            <div class="invalid-feedback">Elija una categoría.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Marca *</label>
            <select class="form-select" id="id_marca" required></select>
            <div class="invalid-feedback">Elija una marca.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Precio *</label>
            <input type="number" class="form-control" id="precio" required min="1" step="1">
            <div class="invalid-feedback">Mayor que 0.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Stock inicial *</label>
            <input type="number" class="form-control" id="stock" required min="0" step="1">
            <div class="invalid-feedback">0 o más.</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Stock mínimo *</label>
            <input type="number" class="form-control" id="stock_minimo" required min="0" step="1">
            <div class="invalid-feedback">0 o más.</div>
          </div>
          <p class="small text-secondary mb-0 d-none" id="notaStock">
            <i class="bi bi-info-circle"></i> El stock se cambia con compras y ventas en <strong>Movimientos</strong>.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-taller" id="btnGuardar"><i class="bi bi-save"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/repuestos.js"></script>
</body>
</html>
