<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trabajos | El Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-tools text-taller"></i> Trabajos del taller</h1>
        <p class="text-secondary mb-0" id="subtitulo"><span id="contador">0</span> trabajos</p>
      </div>
      <button class="btn btn-taller d-none" id="btnNuevo"><i class="bi bi-plus-lg"></i> Nuevo trabajo</button>
    </div>

    <div class="card shadow-sm mb-3"><div class="card-body">
      <div class="row g-2">
        <div class="col-md-3">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="buscar" placeholder="Placa o apodo">
          </div>
        </div>
        <div class="col-6 col-md-2">
          <select class="form-select" id="filtroEstado">
            <option value="">Todos los estados</option>
            <option>PENDIENTE</option><option>EN PROCESO</option><option>TERMINADO</option>
          </select>
        </div>
        <div class="col-6 col-md-3 d-none" id="cajaFiltroTrabajador">
          <select class="form-select" id="filtroTrabajador"></select>
        </div>
        <div class="col-6 col-md-2">
          <input type="date" class="form-control" id="desde" title="Desde">
        </div>
        <div class="col-6 col-md-2">
          <input type="date" class="form-control" id="hasta" title="Hasta">
        </div>
      </div>
    </div></div>

    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr><th>Fecha</th><th>Moto</th><th>Cliente</th><th>Trabajo</th><th>Trabajador</th>
              <th class="text-end">Costo</th><th>Estado</th><th class="text-end">Acciones</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div></div>
  </main>

  <div class="modal fade" id="modalTrabajo" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="formTrabajo" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloModal">Nuevo trabajo</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-12">
            <label class="form-label">Moto *</label>
            <select class="form-select" id="id_moto" required></select>
            <div class="invalid-feedback">Elija la moto.</div>
          </div>
          <div class="col-12 d-none" id="cajaTrabajador">
            <label class="form-label">Trabajador asignado *</label>
            <select class="form-select" id="id_usuario"></select>
            <div class="invalid-feedback">Elija el trabajador.</div>
          </div>
          <div class="col-12">
            <label class="form-label">¿Qué se le hizo / qué hay que hacerle? *</label>
            <textarea class="form-control" id="descripcion" rows="3" required minlength="5" maxlength="300"></textarea>
            <div class="invalid-feedback">Mínimo 5 caracteres.</div>
          </div>
          <div class="col-6">
            <label class="form-label">Costo mano de obra *</label>
            <input type="number" class="form-control" id="costo" required min="0" step="1000">
            <div class="invalid-feedback">0 o más.</div>
          </div>
          <div class="col-6">
            <label class="form-label">Estado *</label>
            <select class="form-select" id="estado" required>
              <option>PENDIENTE</option><option>EN PROCESO</option><option>TERMINADO</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-taller"><i class="bi bi-save"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/trabajos.js"></script>
</body>
</html>
