<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuarios | El Hospital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../css/estilos.css" rel="stylesheet">
</head>
<body>
  <div id="menu"></div>

  <main class="container py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-person-gear text-taller"></i> Usuarios y roles</h1>
        <p class="text-secondary mb-0">Personal con acceso al sistema · <span id="contador">0</span></p>
      </div>
      <button class="btn btn-taller" id="btnNuevo"><i class="bi bi-person-plus"></i> Nuevo usuario</button>
    </div>

    <div class="card shadow-sm mb-3"><div class="card-body">
      <div class="row g-2">
        <div class="col-md-8">
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-search"></i></span>
            <input type="search" class="form-control" id="buscar" placeholder="Buscar por nombre o usuario">
          </div>
        </div>
        <div class="col-md-4"><select class="form-select" id="filtroRol"></select></div>
      </div>
    </div></div>

    <div class="card shadow-sm"><div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-dark">
          <tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>Estado</th><th>Creado</th><th class="text-end">Acciones</th></tr>
        </thead>
        <tbody id="tabla"></tbody>
      </table>
    </div></div>
  </main>

  <div class="modal fade" id="modalUsuario" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="formUsuario" novalidate>
        <div class="modal-header">
          <h2 class="modal-title h5" id="tituloModal">Nuevo usuario</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-12">
            <label class="form-label">Nombre completo *</label>
            <input class="form-control" id="nombre" required minlength="3" maxlength="100">
            <div class="invalid-feedback">Mínimo 3 caracteres.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Usuario *</label>
            <input class="form-control" id="usuario" required pattern="[a-z0-9_]{3,30}" autocomplete="off">
            <div class="invalid-feedback">Minúsculas, números o _ (3 a 30).</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" id="etiquetaContrasena">Contraseña *</label>
            <input type="password" class="form-control" id="contrasena" minlength="6" maxlength="50" autocomplete="new-password">
            <div class="invalid-feedback">Mínimo 6 caracteres.</div>
            <div class="form-text d-none" id="notaContrasena">Déjela vacía para no cambiarla.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Rol *</label>
            <select class="form-select" id="id_rol" required></select>
            <div class="invalid-feedback">Elija un rol.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Acceso</label>
            <select class="form-select" id="activo">
              <option value="S">Activo (puede entrar)</option>
              <option value="N">Inactivo (sin acceso)</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-taller"><i class="bi bi-save"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/usuarios.js"></script>
</body>
</html>
